id: aafacb16-3872-11ea-a137-2e728ce88127
script_id: fd60fcd1-4809-4813-b510-4a18856a595c
revision: '123'
category: location_based
priority: 1

overview:
  translation_keys:
    name: behavior.comingHome.overview.name
    description: behavior.comingHome.overview.description
  image: images/coming_home.webp

dashboard:
  comparators:
    - sort_by: creation_time
  card:
    title:
      - value_name: name
        value_formatter: plain_text
    subtitle:
      value_name: where
      value_formatter: lights_action_in_groups
      formatter_translation_key: behavior.comingHome.card.subtitle

configuration:
  light_capabilities: [any]
  max_instance_count: 1

creation:
  - step_type: preconditions
  - step_type: when_selection
    result_name: when_constrained
    translation_keys:
      title: behavior.comingHome.when.title
  - step_type: lights_selection
    result_name: where
    configuration:
      allow_home: true
      allow_individual_lights: true
      max_groups: 4
    translation_keys:
      title: behavior.comingHome.selectLights.title
  - step_type: scene_selection
    result_name: what
    configuration:
      lights_result_name: where
    translation_keys:
      title: behavior.comingHome.selectScenes.title
    default_type: recipe
    default_recipe: bright
  - step_type: name_setting
    is_hidden: true
    translation_keys:
      default_name: behavior.comingHome.name
  - step_type: state_selection
    is_hidden: true
    default_value: enabled

editing:
  - step_type: name_setting
    is_editable: false
  - step_type: when_selection
    result_name: when_constrained
    translation_keys:
      title: behavior.comingHome.when.title
  - step_type: lights_selection
    result_name: where
    configuration:
      allow_home: true
      allow_individual_lights: true
      max_groups: 4
    translation_keys:
      title: behavior.comingHome.selectLights.title
  - step_type: scene_selection
    result_name: what
    configuration:
      lights_result_name: where
    translation_keys:
      title: behavior.comingHome.selectScenes.title
    default_type: recipe
    default_recipe: bright
  - step_type: state_selection
    default_value: enabled
