supported_accessories:
- FOHSWITCH

edit_steps:
  - step_type: migration
    banner_message_body: accessory.behavior.fohSwitch.edit.migration.splitBannerWithoutAsf.message.body
  - step_type: name_selection
  - step_type: location_selection
  - step_type: control_selection
    accessory_control_definitions:
      - control:
          type: button
          id: 1
        selected_image: images/foh-switch_top-left-button.svg
      - control:
          type: button
          id: 2
        selected_image: images/foh-switch_bottom-left-button.svg
      - control:
          type: button
          id: 3
        selected_image: images/foh-switch_top-right-button.svg
      - control:
          type: button
          id: 4
        selected_image: images/foh-switch_bottom-right-button.svg
  - step_type: control_mode
    control_mode_translations:
      - control:
          type: button
          id: 1
        translation: accessory.behavior.fohSwitch.edit.lightSelection.topLeftButton.description.text
      - control:
          type: button
          id: 2
        translation: accessory.behavior.fohSwitch.edit.lightSelection.bottomLeftButton.description.text
      - control:
          type: button
          id: 3
        translation: accessory.behavior.fohSwitch.edit.lightSelection.topRightButton.description.text
      - control:
          type: button
          id: 4
        translation: accessory.behavior.fohSwitch.edit.lightSelection.bottomRightButton.description.text
  - step_type: light_selection
    light_selection_translations:
      - control:
          type: button
          id: 1
        translation: accessory.behavior.fohSwitch.edit.lightSelection.topLeftButton.description.text
      - control:
          type: button
          id: 2
        translation: accessory.behavior.fohSwitch.edit.lightSelection.bottomLeftButton.description.text
      - control:
          type: button
          id: 3
        translation: accessory.behavior.fohSwitch.edit.lightSelection.topRightButton.description.text
      - control:
          type: button
          id: 4
        translation: accessory.behavior.fohSwitch.edit.lightSelection.bottomRightButton.description.text

  - step_type: action_selection
    action_edit_definitions:
      # top left
      - control:
          type: button
          id: 1
        action_edit_configurations:
          - edit_configuration_type: configurable
            action_selection_header_text: accessory.behavior.fohSwitch.edit.topLeftButton.press.header.text
            requires_full_screen: true
            allow_group_scenes_selection: true
            allow_selecting_smart_scenes_for_action_archetypes:
              - time_based
              - scene_per_group
              - scene_cycle_per_group
            selectable_action_archetypes:
              - archetype: time_based
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: scene_cycle_per_group
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: scene_per_group
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: single_scene
                control_action_key: on_press
                action:
                  action_type: off
          - edit_configuration_type: static
            header_text: accessory.behavior.fohSwitch.edit.topLeftButton.longPress.header.text
            requires_full_screen: true
            selectable_action_archetypes:
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: off
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: bridge_off
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: do_nothing
              - archetype: single_scene
                control_action_key: on_repeat
                action:
                  action_type: dim_alternate
              - archetype: single_scene
                control_action_key: on_repeat
                action:
                  action_type: dim_down
              - archetype: single_scene
                control_action_key: on_repeat
                action:
                  action_type: dim_up
      # bottom left
      - control:
          type: button
          id: 2
        action_edit_configurations:
