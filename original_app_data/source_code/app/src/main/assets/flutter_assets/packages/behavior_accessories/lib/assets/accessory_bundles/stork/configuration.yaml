control_defaults:
  - defaults:
    - control:
        type: contact_sensor
      action_key: on_open
      preferred_action_archetypes:
        - light_capability: dimmable
          action_archetype: scene_per_group
        - light_capability: on_off
          action_archetype: scene_per_group
      default_actions_per_archetype:
        - action_archetype: scene_per_group
          actions:
            - light_capability: white_ambiance
              default_action:
                action_archetype: scene_per_group
                action:
                  action_type: recipe
                  recipe: bright
            - light_capability: dimmable
              default_action:
                action_archetype: scene_per_group
                action:
                  action_type: recipe
                  recipe: bright
            - light_capability: on_off
              default_action:
                action_archetype: scene_per_group
                action:
                  action_type: on
    - control:
        type: contact_sensor
      action_key: on_close
      preferred_action_archetypes:
        - light_capability: on_off
          action_archetype: scene_per_group_timer
      default_actions_per_archetype:
        - action_archetype: scene_per_group_timer
          timer_type: time_out_after
          duration_ms: 300000
          actions:
            - light_capability: white_ambiance
              default_action:
                action_archetype: scene_per_group_timer
                action:
                  action_type: off
            - light_capability: dimmable
              default_action:
                action_archetype: scene_per_group_timer
                action:
                  action_type: off
            - light_capability: on_off
              default_action:
                action_archetype: scene_per_group_timer
                action:
                  action_type: off