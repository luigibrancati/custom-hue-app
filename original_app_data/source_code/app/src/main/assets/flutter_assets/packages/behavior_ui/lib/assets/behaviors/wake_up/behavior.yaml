id: aafacb16-3872-11ea-a137-2e728ce88125
script_id: ff8957e3-2eb9-4699-a0c8-ad2cb3ede704
revision: '123'
category: wake_up
priority: 1

overview:
  translation_keys:
    name: behavior.wakeup.overview.name
    description: behavior.wakeup.overview.description
  image: images/wake_up.webp

dashboard:
  comparators:
    - sort_by: display_time
      value_name: when
    - sort_by: creation_time
  card:
    title:
      - value_name: when
        value_formatter: display_time
      - value_name: name
        value_formatter: plain_text
    subtitle:
      value_name: when
      value_formatter: recurrence

configuration:
  light_capabilities: [any]
  recommended_light_capability: sunrise

creation:
  - step_type: lights_selection
    result_name: where
    configuration:
      allow_home: true
      allow_individual_lights: true
      max_groups: 4
    translation_keys:
      title: behavior.wakeup.selectLights.title
  - step_type: time_and_recurrence_selection
    result_name: when
    default_value:
      time:
        hour: 7
        minute: 0
      recurrence_days: ["Mon","Tue","Wed","Thu","Fri"]
    translation_keys:
      title: behavior.wakeup.timeAndRecurrence.title
    configuration:
      fade_result_name: fade_in_duration
  - step_type: composite
    steps:
      - step_type: option_selection_step
        result_name: style
        translation_keys:
          title: behavior.wakeup.edit.styleItem.title
          subtitle: behavior.wakeup.edit.styleItem.subtitle
        options:
          - value: sunrise
            translation_keys:
              title: behavior.wakeup.style.sunrise.title
              subtitle: behavior.wakeup.style.sunrise.subtitle
            thumbnail:
              colors: ["#002B59", "#0068A3", "#E0B8FF", "#FFA556", "#FFCEA6", "#FFEDDE"]
            required_feature: style_sunrise
          - value: basic
            translation_keys:
              title: behavior.wakeup.style.basic.title
              subtitle: behavior.wakeup.style.basic.subtitle
            thumbnail:
              colors: ["#3F2F0A", "#FFEFCA"]
            omit_if_only_supported_option: true
        default_value_when_creating: sunrise
        default_value_when_missing: basic
      - step_type: brightness_selection
        result_name: end_brightness
        required_feature: intensity
        default_value: 100
        lights_result_name: where
        translation_keys:
          title: behavior.wakeup.edit.brightnessItem.title
      - step_type: lights_off_after_selection
        result_name: turn_lights_off_after
        default_value:
          enabled: false
        configuration:
          default_duration: 3600
    translation_keys:
      title: behavior.wakeup.experience.title
  - step_type: fade_selection
    result_name: fade_in_duration
    is_hidden: true
    default_value: 1800
    configuration:
      time_result_name: when
      duration_type: fade_end
  - step_type: state_selection
    is_hidden: true
    default_value: enabled
  - step_type: name_setting
    translation_keys:
      title: behavior.wakeup.nameStep.title
      label: behavior.wakeup.nameStep.label
      default_name: behavior.wakeup.nameStep.defaultName

editing:
  - step_type: name_setting
  - step_type: time_and_recurrence_selection
    result_name: when
    translation_keys:
      title: behavior.wakeup.timeAndRecurrence.title
    configuration:
      fade_result_name: fade_in_duration
      fade_selection_step:
        step_type: fade_selection
        result_name: fade_in_duration
        configuration:
          time_result_name: when
          duration_type: fade_end
  - step_type: lights_selection
    result_name: where
    configuration:
      allow_home: true
      allow_individual_lights: true
      max_groups: 4
    translation_keys:
      title: behavior.wakeup.selectLights.title
  - step_type: composite
    steps:
    - step_type: option_selection_step
      result_name: style
      translation_keys:
        title: behavior.wakeup.edit.styleItem.title
        subtitle: behavior.wakeup.edit.styleItem.subtitle
      options:
        - value: sunrise
          translation_keys:
            title: behavior.wakeup.style.sunrise.title
          thumbnail:
            colors: ["#002B59", "#0068A3", "#E0B8FF", "#FFA556", "#FFCEA6", "#FFEDDE"]
          required_feature: style_sunrise
        - value: basic
          translation_keys:
            title: behavior.wakeup.style.basic.title
          thumbnail:
            colors: ["#3F2F0A", "#FFEFCA"]
    - step_type: brightness_selection
      result_name: end_brightness
      required_feature: intensity
      translation_keys:
        title: behavior.wakeup.edit.brightnessItem.title
      lights_result_name: where
    - step_type: lights_off_after_selection
      result_name: turn_lights_off_after
      configuration:
        default_duration: 3600
    translation_keys:
      title: behavior.wakeup.generalStep.title
  - step_type: state_selection
    default_value: enabled
