id: d4f0fbcc-dec7-41cf-bba5-bc481fed253b
script_id: 0194752a-2d53-4f92-8209-dfdc52745af3
revision: '123'
category: location_based
priority: 2

overview:
  translation_keys:
    name: behavior.leavingHome.overview.name
    description: behavior.leavingHome.overview.description
  image: images/leaving_home.webp

dashboard:
  comparators:
    - sort_by: creation_time
  card:
    title:
      - value_name: name
        value_formatter: plain_text
    subtitle:
      value_name: where
      value_formatter: lights_action_in_groups
      formatter_translation_key: behavior.leavingHome.card.subtitle

configuration:
  light_capabilities: [any]
  max_instance_count: 1

creation:
  - step_type: preconditions
  - step_type: lights_selection
    result_name: where
    configuration:
      allow_home: true
      allow_individual_lights: true
      max_groups: 4
    translation_keys:
      title: behavior.leavingHome.selectLights.title
  - step_type: scene_selection
    result_name: what
    is_enabled: false
    configuration:
      lights_result_name: where
    translation_keys:
      title: behavior.leavingHome.selectScenes.title
    default_type: off
  - step_type: name_setting
    is_hidden: true
    translation_keys:
      default_name: behavior.leavingHome.name
  - step_type: state_selection
    is_hidden: true
    default_value: enabled

editing:
  - step_type: name_setting
    is_editable: false
  - step_type: lights_selection
    result_name: where
    configuration:
      allow_home: true
      allow_individual_lights: true
      max_groups: 4
    translation_keys:
      title: behavior.leavingHome.selectLights.title
  - step_type: scene_selection
    is_enabled: false # Currently ONLY supported for scene_selection step
    result_name: what
    configuration:
      lights_result_name: where
    translation_keys:
      title: behavior.leavingHome.selectScenes.title
    default_type: off
  - step_type: state_selection
    default_value: enabled
