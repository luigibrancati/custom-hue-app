          type: button
          id: 3
        translation: accessory.behavior.tapSwitch.edit.lightSelection.thirdButton.description.text
      - control:
          type: button
          id: 4
        translation: accessory.behavior.tapSwitch.edit.lightSelection.fourthButton.description.text

  - step_type: action_selection
    action_edit_definitions:
      - control:
          type: button
          id: 1
        action_edit_configurations:
          - edit_configuration_type: configurable
            action_selection_header_text: accessory.behavior.tapSwitch.edit.onPress.button1.header.text
            requires_full_screen: true
            allow_group_scenes_selection: true
            allow_selecting_smart_scenes_for_action_archetypes:
              - time_based
              - scene_per_group
              - scene_cycle_per_group
            selectable_action_archetypes:
              - archetype: time_based
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: scene_cycle_per_group
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: scene_per_group
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: single_scene
                control_action_key: on_press
                action:
                  action_type: off
