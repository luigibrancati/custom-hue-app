supported_accessories:
- ZGPSWITCH

edit_steps:
  - step_type: migration
    banner_message_body: accessory.behavior.tapSwitch.edit.migration.splitBannerWithoutAsf.message.body
  - step_type: name_selection
  - step_type: location_selection
  - step_type: control_selection
    accessory_control_definitions:
      - control:
          type: button
          id: 1
        selected_image: images/tap_switch-button1.svg
      - control:
          type: button
          id: 2
        selected_image: images/tap_switch-button2.svg
      - control:
          type: button
          id: 3
        selected_image: images/tap_switch-button3.svg
      - control:
          type: button
          id: 4
        selected_image: images/tap_switch-button4.svg
  - step_type: control_mode
    control_mode_translations:
      - control:
          type: button
          id: 1
        translation: accessory.behavior.tapSwitch.edit.lightSelection.firstButton.description.text
      - control:
          type: button
          id: 2
        translation: accessory.behavior.tapSwitch.edit.lightSelection.secondButton.description.text
      - control:
          type: button
          id: 3
        translation: accessory.behavior.tapSwitch.edit.lightSelection.thirdButton.description.text
      - control:
          type: button
          id: 4
        translation: accessory.behavior.tapSwitch.edit.lightSelection.fourthButton.description.text
