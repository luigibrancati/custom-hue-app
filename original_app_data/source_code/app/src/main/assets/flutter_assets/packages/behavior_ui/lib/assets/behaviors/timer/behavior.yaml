id: 55588a40-cf43-11eb-b8bc-0242ac130003
script_id: e73bc72d-96b1-46f8-aa57-729861f80c78
revision: '123'
category: timer
priority: 1

overview:
  translation_keys:
    name: behavior.timer.overview.name
    description: behavior.timer.overview.description
  image: images/timer.webp

dashboard:
  comparators:
    - sort_by: name
    - sort_by: creation_time
  card:
    title:
      - value_name: duration
        value_formatter: duration
      - value_name: name
        value_formatter: plain_text
    subtitle:
      value_name: where
      value_formatter: lights_action_in_groups
      formatter_translation_key: behavior.timer.card.subtitle

configuration:
  light_capabilities: [any]

creation:
  - step_type: duration_selection
    result_name: duration
    default_value: 60
    translation_keys:
      title: behavior.timer.selectDuration.title
      invalid_duration_error_message: behavior.timer.selectDuration.invalid.errorMessage
  - step_type: lights_selection
    result_name: where
    configuration:
      allow_home: true
      allow_individual_lights: true
      max_groups: 4
    translation_keys:
      title: behavior.timer.selectLights.title
  - step_type: scene_selection
    result_name: what
    configuration:
      options: [blink]
      lights_result_name: where
    translation_keys:
      title: behavior.timer.selectScenes.title
    default_type: recipe
    default_recipe: bright
  - step_type: state_selection
    is_hidden: true
    default_value: enabled
  - step_type: name_setting
    translation_keys:
      title: behavior.timer.nameStep.title
      label: behavior.timer.nameStep.label
      default_name: behavior.timer.nameStep.defaultName
    should_save: true
  - step_type: trigger_explanation

editing:
  - step_type: name_setting
  - step_type: duration_selection
    result_name: duration
    translation_keys:
      title: behavior.timer.selectDuration.title
      invalid_duration_error_message: behavior.timer.selectDuration.invalid.errorMessage
  - step_type: lights_selection
    result_name: where
    configuration:
      allow_home: true
      allow_individual_lights: true
      max_groups: 4
    translation_keys:
      title: behavior.timer.selectLights.title
  - step_type: scene_selection
    result_name: what
    configuration:
      options: [blink]
      lights_result_name: where
    translation_keys:
      title: behavior.timer.selectScenes.title
    default_type: recipe
    default_recipe: bright
  - step_type: state_selection
    default_value: enabled
  - step_type: composite
    steps:
      - step_type: controlling_devices
    translation_keys:
      title: behavior.timer.controllingDevicesStep.title
