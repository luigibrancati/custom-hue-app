supported_accessories:
- LGT001
- LGT002
- LGT003
- LGT004
- LGT005
- LGT006
- LGT007
- LGT008
- LGT013
- LGT014

edit_steps:
  - step_type: name_selection
  - step_type: location_selection
  - step_type: control_selection
    accessory_control_definitions:
      - control:
          type: button
          id: 1
        # stub images
        selected_image: images/twilight_button-1.svg
      - control:
          type: button
          id: 2
        # stub images
        selected_image: images/twilight_button-1.svg

  - step_type: control_mode
    control_mode_translations:
      - control:
          type: button
          id: 1
        translation: accessory.behavior.bedsideLuminaire.edit.lightSelection.button1.description.text
      - control:
          type: button
          id: 2
        translation: accessory.behavior.bedsideLuminaire.edit.lightSelection.button2.description.text

  - step_type: light_selection
    light_selection_translations:
      - control:
          type: button
          id: 1
        translation: accessory.behavior.bedsideLuminaire.edit.lightSelection.button1.description.text
      - control:
          type: button
          id: 2
        translation: accessory.behavior.bedsideLuminaire.edit.lightSelection.button2.description.text

  - step_type: action_banner
    condition: behavior_non_configured
    title: accessory.behavior.bedsideLuminaire.edit.nonConfigured.actionBanner.title
    text: accessory.behavior.bedsideLuminaire.edit.nonConfigured.actionBanner.text

  - step_type: action_selection
    action_edit_definitions:
      - control:
          type: button
          id: 1
        action_edit_configurations:
          - edit_configuration_type: configurable
            requires_full_screen: true
            allow_group_scenes_selection: true
            allow_selecting_smart_scenes_for_action_archetypes:
              - time_based
              - scene_per_group
              - scene_cycle_per_group
            selectable_action_archetypes:
              - archetype: scene_per_group
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: scene_cycle_per_group
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: time_based
                control_action_key: on_press
                is_with_off_selectable: true
          - edit_configuration_type: static
            requires_full_screen: false
            header_text: accessory.behavior.bedsideLuminaire.edit.button1.longPress.header.text
            selectable_action_archetypes:
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: off
              - archetype: single_scene
                control_action_key: on_repeat
                action:
                  action_type: dim_alternate
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: bridge_off
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: do_nothing
      - control:
          type: button
          id: 2
        action_edit_configurations:
          - edit_configuration_type: configurable
            requires_full_screen: true
            allow_group_scenes_selection: true
            allow_selecting_smart_scenes_for_action_archetypes:
              - time_based
              - scene_per_group
              - scene_cycle_per_group
            selectable_action_archetypes:
              - archetype: scene_per_group
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: scene_cycle_per_group
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: time_based
                control_action_key: on_press
                is_with_off_selectable: true
          - edit_configuration_type: static
            requires_full_screen: false
            header_text: accessory.behavior.bedsideLuminaire.edit.button2.longPress.header.text
            selectable_action_archetypes:
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: off
              - archetype: single_scene
                control_action_key: on_repeat
                action:
                  action_type: dim_alternate
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: bridge_off
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: do_nothing