supported_accessories:
- ROTARY
- Z3-1BRL

edit_steps:
  - step_type: migration
    banner_message_body: accessory.behavior.lutronAurora.edit.migration.splitBannerWithoutAsf.message.body
  - step_type: name_selection
  - step_type: location_selection
  - step_type: control_selection
    accessory_control_definitions:
      - control:
          type: button
          id: 1
        selected_image: images/lutron-button.svg
      - control:
          type: rotary
        selected_image: images/lutron-dim.svg
  - step_type: control_mode
    control_mode_translations:
      - control:
          type: button
          id: 1
        translation: accessory.behavior.lutronAurora.edit.lightSelection.button.description.text
      - control:
          type: rotary
        translation: accessory.behavior.lutronAurora.edit.lightSelection.rotary.description.text
  - step_type: light_selection
    light_selection_translations:
      - control:
          type: button
          id: 1
        translation: accessory.behavior.lutronAurora.edit.lightSelection.button.description.text
      - control:
          type: rotary
        translation: accessory.behavior.lutronAurora.edit.lightSelection.rotary.description.text

  - step_type: action_selection
    action_edit_definitions:
      - control:
          type: button
          id: 1
        action_edit_configurations:
          - edit_configuration_type: configurable
            requires_full_screen: true
            allow_group_scenes_selection: true
            allow_selecting_smart_scenes_for_action_archetypes:
              - time_based
              - scene_cycle_per_group
              - scene_per_group
            selectable_action_archetypes:
              - archetype: time_based
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: scene_cycle_per_group
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: scene_per_group
                control_action_key: on_press
                is_with_off_selectable: true
              - archetype: single_scene
                control_action_key: on_press
                action:
                  action_type: off
          - edit_configuration_type: static
            requires_full_screen: false
            header_text: accessory.behavior.lutronAurora.edit.button.longPress.header.text
            selectable_action_archetypes:
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: off
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: bridge_off
              - archetype: single_scene
                control_action_key: on_long_press
                action:
                  action_type: do_nothing
      - control:
          type: rotary
        action_edit_configurations:
          - edit_configuration_type: configurable
            header_text: accessory.behavior.lutronAurora.edit.onDimOn.header.text
            footer_text: accessory.behavior.lutronAurora.edit.onDimOn.footer.text
            requires_full_screen: true
            allow_group_scenes_selection: false
            selectable_action_archetypes:
              - archetype: scene_per_group
                control_action_key: on_dim_on
                is_with_off_selectable: false
          - edit_configuration_type: static
            requires_full_screen: false
            selectable_action_archetypes:
              - archetype: single_scene
                control_action_key: on_dim_off
                action:
                  action_type: minimum_brightness
              - archetype: single_scene
                control_action_key: on_dim_off
                action:
                  action_type: off