named_control_defaults:
  scene_cycle:
    - name: wca
      defaults:
        slots:
          - action_type: recipe
            recipe: energize
          - action_type: recipe
            recipe: concentrate
          - action_type: recipe
            recipe: read
          - action_type: recipe
            recipe: relax
          - action_type: recipe
            recipe: night_light
        scene_suggestions:
          - action_type: recipe
            recipe: bright
          - action_type: recipe
            recipe: concentrate
          - action_type: recipe
            recipe: dimmed
          - action_type: on
          - action_type: off
          - action_type: do_nothing
        new_slot_action:
          action_type: recipe
          recipe: bright
    - name: dimmable
      defaults:
        slots:
          - action_type: recipe
            recipe: read
          - action_type: recipe
            recipe: relax
          - action_type: recipe
            recipe: dimmed
          - action_type: recipe
            recipe: night_light
          - action_type: recipe
            recipe: read
        scene_suggestions:
          - action_type: recipe
            recipe: bright
          - action_type: recipe
            recipe: relax
          - action_type: recipe
            recipe: dimmed
          - action_type: on
          - action_type: off
          - action_type: do_nothing
        new_slot_action:
          action_type: recipe
          recipe: bright
    - name: on_off
      defaults:
        slots:
          - action_type: on
          - action_type: on
          - action_type: on
          - action_type: on
          - action_type: on
        scene_suggestions:
          - action_type: on
          - action_type: off
          - action_type: do_nothing
        new_slot_action:
          action_type: on
  time_based:
    - name: wca
      defaults:
        time_slots:
          - start_time: 07:00
            action: 
              action_type: recipe
              recipe: energize
          - start_time: 10:00
            action: 
              action_type: recipe
              recipe: concentrate
          - start_time: 17:00
            action: 
              action_type: recipe
              recipe: read
          - start_time: 20:00
            action: 
              action_type: recipe
              recipe: relax
          - start_time: 23:00
            action: 
              action_type: recipe
              recipe: night_light
        scene_suggestions:
          - start_time: 00:00
            suggestions:
            - action_type: recipe
              recipe: bright
            - action_type: recipe
              recipe: concentrate
            - action_type: recipe
              recipe: night_light
            - action_type: on
            - action_type: off
            - action_type: do_nothing
        new_slot_action:
          action_type: recipe
          recipe: bright
    - name: dimmable
      defaults:
        time_slots:
          - start_time: 07:00
            action: 
              action_type: recipe
              recipe: bright
          - start_time: 17:00
            action: 
              action_type: recipe
              recipe: dimmed
          - start_time: 23:00
            action: 
              action_type: recipe
              recipe: night_light
        scene_suggestions:
          - start_time: 00:00
            suggestions:
            - action_type: recipe
              recipe: bright
            - action_type: recipe
              recipe: relax
            - action_type: recipe
              recipe: night_light
            - action_type: on
            - action_type: off
            - action_type: do_nothing
        new_slot_action:
          action_type: recipe
          recipe: bright
    - name: on_off
      defaults:
        time_slots:
          - start_time: 07:00
            action: 
              action_type: on
          - start_time: 23:00
            action: 
              action_type: on
        scene_suggestions:
          - start_time: 00:00
            suggestions:
            - action_type: on
            - action_type: off
            - action_type: do_nothing
        new_slot_action:
          action_type: on