control_defaults:
  - filter:
      tags: [ "edit" ]
    defaults:
      # Button press actions
      - control:
          type: button
          id: 1
        action_key: on_press
        preferred_action_archetypes:
          - light_capability: dimmable
            action_archetype: scene_cycle_per_group
          - light_capability: on_off
            action_archetype: scene_per_group
        default_actions_per_archetype:
          - action_archetype: scene_per_group
            actions:
              - light_capability: white_ambiance
                default_action:
                  action_archetype: scene_per_group
                  action:
                    action_type: recipe
                    recipe: bright
              - light_capability: dimmable
                default_action:
                  action_archetype: scene_per_group
                  action:
                    action_type: recipe
                    recipe: read
              - light_capability: on_off
                default_action:
                  action_archetype: scene_per_group
                  action:
                    action_type: on
          - action_archetype: scene_cycle_per_group
            actions:
              - light_capability: white_ambiance
                default_action:
                  action_archetype: scene_cycle_per_group
                  name: wca
              - light_capability: dimmable
                default_action:
                  action_archetype: scene_cycle_per_group
                  name: dimmable
              - light_capability: on_off
                default_action:
                  action_archetype: scene_cycle_per_group
                  name: on_off
          - action_archetype: time_based
            actions:
              - light_capability: white_ambiance
                default_action:
                  action_archetype: time_based
                  name: wca
              - light_capability: dimmable
                default_action:
                  action_archetype: time_based
                  name: dimmable
              - light_capability: on_off
                default_action:
                  action_archetype: time_based
                  name: on_off
        with_off:
          enabled: false
      - control:
          type: button
          id: 2
        action_key: on_press
        preferred_action_archetypes:
          - light_capability: dimmable
            action_archetype: time_based
          - light_capability: on_off
            action_archetype: scene_per_group
        default_actions_per_archetype:
          - action_archetype: scene_per_group
            actions:
              - light_capability: white_ambiance
                default_action:
                  action_archetype: scene_per_group
                  action:
                    action_type: recipe
                    recipe: dimmed
              - light_capability: dimmable
                default_action:
                  action_archetype: scene_per_group
                  action:
                    action_type: recipe
                    recipe: relax
              - light_capability: on_off
                default_action:
                  action_archetype: scene_per_group
                  action:
                    action_type: on
          - action_archetype: scene_cycle_per_group
            actions:
              - light_capability: white_ambiance
                default_action:
                  action_archetype: scene_cycle_per_group
                  name: wca
              - light_capability: dimmable
                default_action:
                  action_archetype: scene_cycle_per_group
                  name: dimmable
              - light_capability: on_off
                default_action:
                  action_archetype: scene_cycle_per_group
                  name: on_off
          - action_archetype: time_based
            actions:
              - light_capability: white_ambiance
                default_action:
                  action_archetype: time_based
                  name: wca
              - light_capability: dimmable
                default_action:
                  action_archetype: time_based
                  name: dimmable
              - light_capability: on_off
                default_action:
                  action_archetype: time_based
                  name: on_off
        with_off:
          enabled: false
      # Button long press actions
      - control:
          type: button
          id: 1
        action_key: on_long_press
        preferred_action_archetypes:
          - light_capability: on_off
            action_archetype: single_scene
        default_actions_per_archetype:
          - action_archetype: single_scene
            actions:
              - light_capability: on_off
                default_action:
                  action_archetype: single_scene
                  action:
                    action_type: off
      - control:
          type: button
          id: 2
        action_key: on_long_press
        preferred_action_archetypes:
          - light_capability: on_off
            action_archetype: single_scene
        default_actions_per_archetype:
          - action_archetype: single_scene
            actions:
              - light_capability: on_off
                default_action:
                  action_archetype: single_scene
                  action:
                    action_type: bridge_off
  - filter:
      tags: [ "commission" ]
    defaults:
      # Button press actions
      - control:
          type: button
          id: 1
        action_key: on_press
        preferred_action_archetypes:
          - light_capability: dimmable
            action_archetype: scene_cycle_per_group
          - light_capability: on_off
            action_archetype: scene_per_group
        default_actions_per_archetype:
          - action_archetype: scene_per_group
            actions:
              - light_capability: white_ambiance
                default_action:
                  action_archetype: scene_per_group
                  action:
                    action_type: recipe
                    recipe: bright
              - light_capability: dimmable
                default_action:
                  action_archetype: scene_per_group
