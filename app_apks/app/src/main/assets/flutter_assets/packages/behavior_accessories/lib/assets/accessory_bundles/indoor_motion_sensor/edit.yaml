supported_accessories:
- SML001
- SML003
- SML003-ALPHA

edit_steps:
  - step_type: migration
    banner_message_body: accessory.behavior.ims.edit.migration.splitBannerWithoutAsf.message.body

  - step_type: name_selection

  - step_type: location_selection
  
  - step_type: light_selection
    light_selection_translations:
      - control:
          type: motion
        translation: accessory.behavior.ims.edit.lightSelection.description.text

  - step_type: sensor_group_selection
    header: accessory.behavior.ims.edit.sensorGroupSelection.header
    footer: accessory.behavior.ims.edit.sensorGroupSelection.footer

  - step_type: action_display
    action_edit_definitions:
      - control:
          type: motion
        action_edit_configurations:
          - edit_configuration_type: configurable
            allow_group_scenes_selection: true
            allow_selecting_smart_scenes_for_action_archetypes:
              - time_based
            requires_full_screen: true
            selectable_action_archetypes:
              - archetype: time_based
                control_action_key: on_motion
                minimum_number_of_slots: 1

  - step_type: security
    header: accessory.behavior.ims.edit.security.header
    arm_when_home_title: accessory.behavior.ims.edit.security.armWhenHome.title
    arm_when_away_title: accessory.behavior.ims.edit.security.armWhenAway.title
    arm_disarm_subtitle: accessory.behavior.ims.edit.security.armDisarm.subtitle
    security_center_setup_message: accessory.behavior.ims.edit.security.securityCenterSetup
    no_permission_message: accessory.behavior.ims.edit.security.noAdminRights

  - step_type: flows
    header: accessory.behavior.ims.edit.sensorGrouping.header
    items:
      - action: group_sensor
        icon_type: sensor_group
        title: accessory.behavior.ims.edit.sensorGrouping.title

  - step_type: settings
    header: accessory.behavior.ims.settings.header
    settings:
      - setting_type: motion_sensitivity
        icon_type: motion_sensitivity
        title: accessory.behavior.ims.settings.motionSensitivity.title
        description: accessory.behavior.ims.settings.motionSensitivity.description
        device_unreachable_warning_text: accessory.behavior.ims.settings.daylightSensitivity.deviceUnreachableWarning
        slider_title: accessory.behavior.ims.settings.motionSensitivity.slider.title
        motion_detected_text: accessory.behavior.ims.settings.motionSensitivity.motionDetected
        detecting_motion_text: accessory.behavior.ims.settings.motionSensitivity.detectingMotion
        adjust_motion_sensitivity_text: accessory.behavior.ims.settings.motionSensitivity.adjustMotionSensitivity
      - setting_type: daylight_sensitivity
        icon_type: daylight_sensitivity
        title: accessory.behavior.ims.settings.daylightSensitivity.title
        description: accessory.behavior.ims.settings.daylightSensitivity.description
        lower_bound_slider_value: 0
        upper_bound_slider_value: 28000
        corrected_upper_bound_slider_value: 65534
        slider_title: accessory.behavior.ims.settings.daylightSensitivity.slider.title
        sensitivity_stages:
          - title: accessory.behavior.ims.settings.daylightSensitivity.stage.low
          - title: accessory.behavior.ims.settings.daylightSensitivity.stage.medium
          - title: accessory.behavior.ims.settings.daylightSensitivity.stage.high
            is_default: true
        default_sensitivity_stage_indication_text: accessory.behavior.ims.settings.daylightSensitivity.slider.defaultIndication
        sufficient_daylight_indication_text: accessory.behavior.ims.settings.daylightSensitivity.sufficientDaylight
        insufficient_daylight_indication_text: accessory.behavior.ims.settings.daylightSensitivity.insufficientDaylight
        max_sensitivity_indication_text: accessory.behavior.ims.settings.daylightSensitivity.maxSensitivity
        device_unreachable_warning_text: accessory.behavior.ims.settings.daylightSensitivity.deviceUnreachableWarning