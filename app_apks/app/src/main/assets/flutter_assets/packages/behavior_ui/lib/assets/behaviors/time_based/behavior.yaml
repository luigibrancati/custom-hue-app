id: aafacb16-3872-11ea-a137-2e728ce88128
script_id: 7238c707-8693-4f19-9095-ccdc1444d228
revision: '123'
category: custom
priority: 1

overview:
  translation_keys:
    name: behavior.timeBased.overview.name
    description: behavior.timeBased.overview.description
  image: images/time_based.webp

dashboard:
  comparators:
    - sort_by: name
    - sort_by: creation_time
  card:
    title:
      - value_name: name
        value_formatter: plain_text
    subtitle:
      value_name: when_extended
      value_formatter: display_time
    copy:
      value_name: when_extended
      value_formatter: recurrence

configuration:
  light_capabilities: [any]

creation:
  - step_type: when_extended_selection
    result_name: when_extended
    default_value:
      recurrence_days: [ "Sun","Mon","Tue","Wed","Thu","Fri","Sat" ]
    translation_keys:
      title: behavior.timeBased.whenExtendedStep.title
  - step_type: lights_selection
    result_name: where
    configuration:
      allow_home: true
      allow_individual_lights: true
      max_groups: 4
    translation_keys:
      title: behavior.timeBased.selectLights.title
  - step_type: scene_selection
    result_name: what
    configuration:
      lights_result_name: where
    translation_keys:
      title: behavior.timeBased.selectScenes.title
    default_type: recipe
    default_recipe: bright
  - step_type: state_selection
    is_hidden: true
    default_value: enabled
  - step_type: name_setting
    translation_keys:
      title: behavior.timeBased.nameStep.title
      label: behavior.timeBased.nameStep.label

editing:
  - step_type: name_setting
  - step_type: when_extended_selection
    result_name: when_extended
    translation_keys:
      title: behavior.timeBased.whenExtendedStep.title
  - step_type: lights_selection
    result_name: where
    configuration:
      allow_home: true
      allow_individual_lights: true
      max_groups: 4
    translation_keys:
      title: behavior.timeBased.selectLights.title
  - step_type: scene_selection
    result_name: what
    configuration:
      lights_result_name: where
    translation_keys:
      title: behavior.timeBased.selectScenes.title
    default_type: recipe
    default_recipe: bright
  - step_type: state_selection
    default_value: enabled
